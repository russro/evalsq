[project]
name = "evalsq"
version = "0.1.0"
description = "Benchmark evaluation heuristics demo for the eval2 workshop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "yfinance>=0.2",
    "matplotlib>=3.7",
]

[project.scripts]
evalsq = "evalsq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
